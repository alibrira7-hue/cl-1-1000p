<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جوهرة القدس | للملابس التقليدية للرجال</title>
    <!-- استيراد خط تجوال الفاخر -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <!-- استيراد أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', sans-serif;
        }

        :root {
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --bg-dark: #090d16;
            --card-bg: rgba(18, 24, 38,  0.65);
            --border-glass: rgba(255, 255, 255, 0.08);
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(30, 58, 138, 0.15) 0%, transparent 50%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* دوال الإضاءة الخلفية الواقعية (Ambient Glow) */
        .ambient-light {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(212, 175, 55, 0.12);
            filter: blur(90px);
            border-radius: 50%;
            z-index: 0;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            animation: pulseGlow 6s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translateX(-50%) scale(1); opacity: 0.6; }
            100% { transform: translateX(-50%) scale(1.2); opacity: 1; }
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 40px 24px;
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.6),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* قسم الملف الشخصي والشعار */
        .profile-section {
            margin-bottom: 35px;
        }

        .avatar-container {
            width: 100px;
            height: 100px;
            margin: 0 auto 18px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 2px solid var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 25px rgba(212, 175, 55, 0.25),
                inset 0 0 15px rgba(212, 175, 55, 0.1);
            position: relative;
        }

        .avatar-container i {
            font-size: 42px;
            color: var(--gold);
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
        }

        h1 {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 8px;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .tagline {
            font-size: 13.5px;
            color: #94a3b8;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .sub-tagline {
            font-size: 12.5px;
            color: var(--gold);
            font-weight: 700;
            letter-spacing: 0.3px;
        }

        /* روابط الـ Links بتأثيرات واقعية */
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 15px 20px;
            color: #ffffff;
            text-decoration: none;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* طبقة إضاءة خفيفة تظهر عند التحويم */
        .link-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s ease;
        }

        .link-card:hover::before {
            transform: translateX(100%);
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(212, 175, 55, 0.4);
            transform: translateY(-3px);
            box-shadow: 
                0 12px 25px rgba(0, 0, 0, 0.3),
                0 0 15px rgba(212, 175, 55, 0.15);
        }

        .link-content {
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 1;
        }

        .link-card i.icon {
            font-size: 20px;
            width: 32px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .link-card:hover i.icon {
            transform: scale(1.15);
        }

        .link-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.2px;
        }

        .link-card .fa-chevron-left {
            font-size: 11px;
            color: #64748b;
            transition: all 0.3s ease;
            z-index: 1;
        }

        .link-card:hover .fa-chevron-left {
            transform: translateX(-4px);
            color: var(--gold);
        }

        /* تذييل الصفحة */
        .footer {
            margin-top: 30px;
            font-size: 11.5px;
            color: #475569;
            letter-spacing: 0.3px;
        }

        .footer span {
            color: var(--gold);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <!-- عنصر الإضاءة المحيطية الخلفية -->
    <div class="ambient-light"></div>

                <i class="fa-solid fa-chevron-left"></i>

            <!-- رابط خرائط جوجل -->
            <a href="https://maps.app.goo.gl/PmcpWEHdcJk63cyk6" target="_blank" class="link-card">
                <div class="link-content">
                    <i class="fa-solid fa-location-dot icon" style="color: #f87171; filter: drop-shadow(0 0 8px rgba(248,113,113,0.4));"></i>
                    <span class="link-title">موقعنا على الخريطة</span>
                </div>
                <i class="fa-solid fa-chevron-left"></i>
            </a>
        </div>

        <!-- الحقوق -->
        <div class="footer">
            جميع الحقوق محفوظة © 2026 <span>جوهرة القدس</span>
        </div>
    </div>

</body>
</html>
